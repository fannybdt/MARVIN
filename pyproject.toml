[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[project]
name = "marvin"
version = "0.1.0"
description = "Generative cell phenotyping with structured latent populations"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Fanny Bodart", email = "fannybdt12@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "azula>=0.11.1",
    "dawgz==2.6.2",
    "h5py>=3.16.0",
    "heracls>=0.6.0",
    "hydra-core>=1.3.2",
    "ipykernel>=7.2.0",
    "jax>=0.9.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "seaborn>=0.13.2",
    "torch>=2.10.0,<2.11.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.5.1",
    "ruff==0.15.5",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["ANN", "B", "I", "UP", "W"]
ignore = ["ANN003", "EXE"]
preview = true

[tool.ruff.lint.isort]
lines-between-types = 1
relative-imports-order = "closest-to-furthest"
section-order = ["future", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
preview = true

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", marker = "sys_platform != 'linux'"},
    {index = "pytorch-cu126", marker = "sys_platform == 'linux'"},
]
torchvision = [
    {index = "pytorch-cpu", marker = "sys_platform != 'linux'"},
    {index = "pytorch-cu126", marker = "sys_platform == 'linux'"},
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"