run_id: test_more_steps
out_dir: outputs/${run_id}

data: data/aml_true.csv  # path to preprocessed CSV

num_steps: 50000
eval_every: 500
save_every: 10000
masked: false
mask_ratio: 0.5

train_loader:
  batch_size: 64
  shuffle: true
  num_workers: 4
  drop_last: true

val_loader:
  batch_size: 64
  shuffle: true
  num_workers: 4
  drop_last: true

test_loader:
  batch_size: 64
  shuffle: false
  num_workers: 0
  drop_last: false

model:
  M: 32  # number of markers
  D: 32  # latent dimension
  factor: 8
  dropout: 0.3
  num_blocks: 2

optimizer:
  lr: 1.0e-3
  base_lr: 1.0e-5
  betas: [0.9, 0.98]
  warmup_steps: 5000
  step_size: 10
  gamma: 0.5

discovery:
  enabled: true
  n_supp_clusters: 3   # extra unknown clusters appended after labeled classes
  unknown_mass: 0.003  # total probability mass reserved for unknown clusters
  masked_classes: []   # classes to treat as unlabeled for rediscovery experiments
                       # K must = (n_classes - len(masked_classes)) + n_supp_clusters

wandb:
  project: TFE
  entity: montefiore_sail
  name: ${run_id}
  id: null
  dir: outputs/
  disable: false

backend: slurm
slurm:
  cpus: 4
  gpus: 1
  mem: 32GB
  time: "24:00:00"
